<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pocket Uplift</title>
    <link rel="manifest" href="../pwa/manifest.json" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="site-header">
      <h1>Pocket Uplift</h1>
      <p class="tagline">Small actions. Meaningful uplift.</p>
    </header>

    <main class="layout">
      <section id="checkin" class="card">
        <h2>Check-in</h2>
        <div id="checkin-root">Check-in UI placeholder</div>
      </section>

      <section id="recommendations" class="card">
        <h2>Recommendations</h2>
        <div id="recommend-root">Recommendations placeholder</div>
      </section>

      <section id="history" class="card">
        <h2>History</h2>
        <div id="history-root">History placeholder</div>
      </section>
    </main>

    <script src="recommend.js"></script>
    <script src="storage.js"></script>
    <script src="app.js"></script>
  </body>
</html>
